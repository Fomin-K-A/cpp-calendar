name: GitHub Classroom Workflow

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/*'

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  Checking-Solution:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository code
        uses: actions/checkout@v3

      - name: Build
        run: |
          if grep -qwRE --include='*.cc' --include='*.cpp' --include='*.h' '<vector>|<list>|<algorithm>|<stack>|<queue>|<deque>|<set>|<map>|<string>' .; then
            echo "Forbidden STL containers"
            exit 9
          fi

          echo "Build..."
          clang++ -pedantic-errors -std=c++17 main.cpp calendar.cpp dayofweek.cpp -o calendar

      - name: Autograding
        uses: amcp-pit/autograding@v1

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Memory leaks
        run: |
          valgrind --tool=memcheck --leak-check=full --undef-value-errors=no --error-exitcode=111 ./calendar 2024

      #- name: Code linting
       # uses: amcp-pit/cpp-linter@v1

      - name: Checkout
        uses: actions/checkout@v3

      - name: CPD
        uses: amcp-pit/cpd-action@v1
        id: cpd
        with:
          repository: ${{ github.repository }}
          collection: ${{ github.repository_owner }}

      - name: Clean
        run: |
          rm -rf ./* || true
          rm -rf ./.??* || true
